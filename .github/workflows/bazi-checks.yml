name: Bazi checks

on:
  pull_request:
    paths:
      - 'skills/bazi/**'
      - '.github/workflows/bazi-checks.yml'
  push:
    branches: [main]
    paths:
      - 'skills/bazi/**'
      - '.github/workflows/bazi-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bazi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Bazi
        run: python -B skills/bazi/scripts/checks.py
      - name: Check standalone installation outside the repository
        shell: bash
        run: |
          standalone_dir="$(mktemp -d)"
          cp -R skills/bazi "$standalone_dir/bazi"
          cd "$standalone_dir"
          python -B bazi/scripts/checks.py
